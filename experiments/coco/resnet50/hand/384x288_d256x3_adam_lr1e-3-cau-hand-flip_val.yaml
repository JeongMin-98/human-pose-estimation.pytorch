GPUS: '0'
DATA_DIR: ''
OUTPUT_DIR: 'output'
LOG_DIR: 'log'
WORKERS: 1
PRINT_FREQ: 5

DATASET:
  DATASET: 'coco'
  ROOT: 'data/coco/'
  DATA_FORMAT: 'jpg'
  TEST_SET: 'hand_cau'
  TRAIN_SET: 'hand_cau'
  FLIP: true
  ROT_FACTOR: 0
  SCALE_FACTOR: 0
MODEL:
  NAME: 'pose_resnet'
  PRETRAINED: ''
  IMAGE_SIZE:
  - 288
  - 384
  NUM_JOINTS: 17
  EXTRA:
    TARGET_TYPE: 'gaussian'
    HEATMAP_SIZE:
    - 72
    - 96
    SIGMA: 2
    FINAL_CONV_KERNEL: 1
    DECONV_WITH_BIAS: false
    NUM_DECONV_LAYERS: 3
    NUM_DECONV_FILTERS:
    - 256
    - 256
    - 256
    NUM_DECONV_KERNELS:
    - 4
    - 4
    - 4
    NUM_LAYERS: 50
LOSS:
  USE_TARGET_WEIGHT: true
TRAIN:
  COCO_FILE: 'data/coco/annotations/hand_cau/hand_cau_train.json'
  BATCH_SIZE: 64
  SHUFFLE: false
  BEGIN_EPOCH: 0
  END_EPOCH: 100
  RESUME: false
  OPTIMIZER: 'adam'
  LR: 0.001
  LR_FACTOR: 0.1
  LR_STEP:
  - 90
  - 120 
  WD: 0.0001
  GAMMA1: 0.99
  GAMMA2: 0.0
  MOMENTUM: 0.9
  NESTEROV: false
TEST:
  BATCH_SIZE: 16
  COCO_FILE: 'data/coco/annotations/hand_cau/hand_cau_test.json'
  COCO_BBOX_FILE: 'data/coco/annotations/hand_cau/hand_cau_test.json'
  BBOX_THRE: 1.0
  FLIP_TEST: true
  IMAGE_THRE: 0.0
  IN_VIS_THRE: 0.2
  MODEL_FILE: 'output/coco/pose_resnet_50/384x288_d256x3_adam_lr1e-3-cau-hand-flip/final_state.pth.tar'
  NMS_THRE: 0.5
  OKS_THRE: 0.3
  USE_GT_BBOX: true
DEBUG:
  DEBUG: true
  SAVE_BATCH_IMAGES_GT: true
  SAVE_BATCH_IMAGES_PRED: true
  SAVE_HEATMAPS_GT: false
  SAVE_HEATMAPS_PRED: false
